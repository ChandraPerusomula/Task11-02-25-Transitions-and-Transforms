<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Transitions & Transforms</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 30px; 
        }

        .image-container {
            width: 300px; 
            height: 200px; 
            overflow: hidden; 
            position: relative; 
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.5s ease; 
        }

        .image-container:hover img {
            transform: scale(1.1); 
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            opacity: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            transition: opacity 0.3s ease; 
        }

        .image-container:hover .overlay {
            opacity: 1; 
        }

        .rotate-image {
            transition: transform 0.8s ease-in-out; 
        }

        .rotate-image:hover {
            transform: rotate(360deg); 
        }

        .grayscale-image {
            transition: filter 0.5s ease; 
        }

        .grayscale-image:hover {
            filter: grayscale(100%); 
        }

        .blur-image {
            transition: filter 0.5s ease;
        }

        .blur-image:hover {
            filter: blur(5px);
        }

    </style>
</head>
<body style="background-color: black;">

    <div class="container">
        <div class="image-container">
            <img src="https://e0.pxfuel.com/wallpapers/894/312/desktop-wallpaper-toji-fushiguro-jujutsu-kaisen-yuji-manga-anime.jpg" alt="Image 1">  <div class="overlay">Image 1 Text</div>
        </div>

        <div class="image-container rotate-image">
            <img src="https://img.freepik.com/premium-photo/anime-character_995105-167.jpg" alt="Image 2"> <div class="overlay">Rotating Image</div>
        </div>

        <div class="image-container grayscale-image">
            <img src="https://th.bing.com/th/id/OIP._PTwyeKD_PJJKuGLuantNgAAAA?rs=1&pid=ImgDetMai" alt="Image 3"> <div class="overlay">Grayscale Image</div>
        </div>

        <div class="image-container blur-image">
            <img src="https://th.bing.com/th/id/OIP.bs9UQaRNCKIjqHUI38z6cgAAAA?rs=1&pid=ImgDetMain" alt="Image 4"> <div class="overlay">Gojo</div>
        </div>
    </div>

</body>
</html>
